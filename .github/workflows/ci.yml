name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 静态检查
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 分层边界
        run: pnpm depcruise
